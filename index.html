<script>
(()=>{'use strict';
const H={"mid": "5a986c72278d2a64ab7f30a2052dbc84fc51453f8767f80c7986a258db2fb19a", "shelf": "76466d4070dbf7fcdf854ce03be749fd7fce2564502e39b20f4a40532444381d", "window": "f1c41b6e5f3bfb3f2e45ed9b812bdce154d4a320690154563efefa29d2f38a01", "aft": "70ee27daca23d463e75a4b909a02533b5bdeb5fb4560245058ff81e747799a8a", "fridge": "4a062fca157631aa2f59002c688a344760bd610213b78e86a12de59c36eabd56", "table": "2a2d14c41595711a4ac74ad093b4b87cd1e53ca11c1e1cd70df4eeb8d182f1e9", "eve": "d3735a248f36344bc70be42bb22cbe5cc47aba325d0ecd1eee2a8cf8a855b44c"},PLACE_HASH='b9da893800fab40f203f4e68129af0779c45422c01daf84877439ec3b8605aa2',BLOB='8cyNNZwREKEUA5CoqJSlh3r4LHJz5kUJKW9HBsX1vYhCJekpIjSQ7ObeWsF+pQh+NWMHJ9yDd3TORSQNkiJeFqS/UPddy+bRKSj46E89GHf4BIMLmBwrnBITBh0Bqv1ZQ9Rq+22zwDa4hn7Il8P6IOmgKDJxPLB1Qb7WvLEhx7bxBtb93CuQ/+5dmokZAp8mtnIgxzxZMf1FworJ',STORAGE='projekt51_v5';
const symbols=[['A','AUGE','◉'],['C','KOMPASS','✣'],['M','MOND','☾'],['F','FEDER','❧'],['K','SCHLÜSSEL','⚿'],['B','BLATT','♧']];
const solutionOrder='ACMFKB',nono=['00100100','00011000','10111101','01111110','01111110','10111101','00011000','00100100'];
const fixedMirrors=[25,13,16,34,32,8,0,23,5,21,18];
const mirrorSolution={25:'/',13:'/',16:'\\',34:'/',32:'\\',8:'/',0:'\\',23:'/',5:'\\',21:'/',18:'\\'};
const startMirrors={25:'\\',13:'/',16:'/',34:'\\',32:'/',8:'\\',0:'\\',23:'/',5:'/',21:'/',18:'\\'};
const stamps={19:'A',33:'B',10:'C'}; // (3,1), (5,3), (1,4)
const defaults={phase:0,order:[],pieces:[4,0,8,2,6,1,7,5,3],swap:null,nono:Array(64).fill(0),mirror:{...startMirrors},trace:[],logic:{},eveKey:'',invalid:0};
let s={...defaults};try{const p=JSON.parse(localStorage.getItem(STORAGE)||'null');if(p&&Number.isInteger(p.phase)&&p.phase>=0&&p.phase<=15)s={...defaults,...p}}catch{}
const $=id=>document.getElementById(id),norm=v=>String(v||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z0-9]/g,'');
const save=()=>localStorage.setItem(STORAGE,JSON.stringify(s));const enc=new TextEncoder();
async function sha(x){let hash=await crypto.subtle.digest('SHA-256',enc.encode(x));return Array.from(new Uint8Array(hash)).map(v=>v.toString(16).padStart(2,'0')).join('')}
async function valid(v,h){return (await sha(norm(v)))===h}
function err(t){const x=$('msg');if(x){x.className='error';x.textContent=t}}
function go(n){s.phase=n;s.invalid=0;s.trace=[];save();render();window.scrollTo({top:0,behavior:'instant'})}
function box(flag,title,inner){return `<section class="panel fade"><div class="tag">${flag}</div><h2>${title}</h2>${inner}<div id="msg"></div></section>`}
function input(id,placeholder='CODE EINGEBEN',mode='text'){return `<input id="${id}" class="field ${mode==='text'?'code':''}" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="${placeholder}" ${mode==='numeric'?'inputmode="numeric"':''}>`}

function hint(t1,t2){return `<details class="hint"><summary>Ich brauche einen Hinweis</summary><p>Hinweis 1: ${t1}</p><details><summary>Stärkerer Hinweis</summary><p>${t2}</p></details></details>`}
async function gate(label,next,hashKey){let v=norm($(label)?.value);if(await valid(v,H[hashKey])){if(hashKey==='eve')s.eveKey=v;go(next)}else err('Dieser Freigabecode gehört nicht zu diesem Fundstück. Prüfe den Umschlag und jedes Zeichen.')}
const codeGate=(title,where,key,next,text)=>box(`ORIGINAL NÖTIG // ${where}`,title,`<p>${text}</p><div class="notice warning">Du brauchst den <strong>unterschiedlichen, langen Freigabecode</strong> auf dem jeweiligen Original. Frühere Codes funktionieren nicht.</div>${input('gate')}<button class="btn full" id="gateBtn">Original prüfen</button>${hint('Suche auf dem genannten Original nach „FREIGABE“.','Die Codes bestehen aus Buchstaben und Ziffern. Die Bindestriche musst du nicht eintippen.')}`);
function render(){let html='';const phase=s.phase; $('status').textContent=phase===1?'AKTE GESCHLOSSEN':phase<7?'AKTE I':phase<12?'AKTE II':'AKTE III';
switch(phase){
case 0:html=box('FRÜHSTÜCK // AKTE 00','Sechs Fundstücke, eine Reihenfolge',`<p>Du hast den QR-Code gefunden. Auf deinem Frühstückszettel stehen sechs Aussagen über sechs Dinge. <strong>Ordne die Dinge so an, dass alle Aussagen gleichzeitig stimmen.</strong></p><p class="muted">Tippe die Karten in der richtigen Reihenfolge an. Die Lösung zeigt dir, wo das Geschenk versteckt ist.</p><div class="slots">${Array.from({length:6},(_,i)=>`<div class="slot ${s.order[i]?'has':''}">${s.order[i]||i+1}</div>`).join('')}</div><div class="order">${symbols.map(([id,label,icon])=>`<button class="tile ${s.order.includes(id)?'selected':''}" data-symbol="${id}" ${s.order.includes(id)?'disabled':''}><b>${icon}</b>${label}</button>`).join('')}</div><div class="inputrow"><button id="undoOrder" class="btn alt">Letzte Karte zurück</button><button id="checkOrder" class="btn" ${s.order.length!==6?'disabled':''}>Reihenfolge prüfen</button></div>${hint('Der Mond liegt direkt rechts vom Kompass. Diese zwei sind ein fester Block.','Die gesuchte Reihenfolge beginnt mit dem Auge; anschließend folgt der Kompass.')}`);break;
case 1:html=`<section class="panel fake"><div class="seal">✦</div><div class="tag">AKTE 00 // ABGESCHLOSSEN</div><h2>Glückwunsch!</h2><p>Du hast das Geschenk gefunden.</p><div class="reveal"><div class="big">SOFA</div><p>Schau im Sofa nach – nicht nur unter dem Kissen, sondern wirklich <strong>im Sofa</strong>.</p></div><p>Viel Spaß mit deinem Geschenk. ♡</p><details class="extra"><summary>Archivzugang</summary><div style="text-align:left;margin-top:14px"><p class="muted">Nur falls dir später jemand einen neuen Umschlag übergibt. Ohne Original kann die Akte nicht geöffnet werden.</p>${input('gate')}<button id="gateBtn" class="btn full">Nachtrag lesen</button><div id="msg"></div></div></details></section>`;break;
case 2:html=box('MITTAG // NACHRICHT 01','Der zerrissene Grundriss',`<p>Die neun Teile gehören zu <strong>einem einzigen Grundriss</strong>. Tippe zwei Teile an, um ihre Positionen zu tauschen. Füge Linien, Schrift und Möbel zu einem Bild zusammen.</p><div class="blueprint" aria-label="Neun vertauschte Teile eines Grundrisses">${s.pieces.map((piece,i)=>`<button class="piece ${s.swap===i?'sel':''}" data-piece="${i}" style="background-position:${(piece%3)*50}% ${Math.floor(piece/3)*50}%" aria-label="Bildteil ${i+1} auswählen"></button>`).join('')}</div><button id="picCheck" class="btn full">Grundriss überprüfen</button>${hint('Die äußere Raumkontur bildet ein geschlossenes Rechteck.','Setze zuerst die vier Eckteile richtig, dann die langen Innenwände. Lies die Beschriftung.')}`);break;
case 3:html=codeGate('Fundstück im Bücherregal','BÜCHERREGAL','shelf',4,'Suche die Papierkarte bei den Büchern. Auf ihr steht der Freigabecode für das nächste Verfahren.');break;
case 4:html=box('AKTE I // PAPIER & LICHT','Die zweite Funktion des Anhängers',`<p>Der Geschenkanhänger hat sieben kleine ausgestanzte Sichtfenster. Lege ihn auf das <strong>7×7-Raster im Bücherregal</strong>. Richte die beiden Dreiecke oben links genau aufeinander aus.</p><div class="notice">Lies die sichtbaren Buchstaben von oben nach unten. Sie ergeben den nächsten Fundort.</div>${input('stencil','SIEBEN BUCHSTABEN')}<button id="stencilCheck" class="btn full">Fundort auswerten</button>${hint('Der Anhänger ist eine Lochschablone, kein Rechenblatt. Halte das Raster genau darunter.','Es gibt genau einen Buchstaben in jeder Zeile, den du sehen sollst.')}`);break;
case 5:html=codeGate('Die Karte am Fenster','FENSTER','window',6,'Am Fenster liegt eine weitere Papierkarte. Erst der dort gedruckte Freigabecode öffnet die Bildrekonstruktion.');break;
case 6:{const rc=nono.map(r=>r.match(/1+/g)?.map(z=>z.length).join(' ')||'0');const cc=Array.from({length:8},(_,c)=>nono.map(r=>r[c]).join('').match(/1+/g)?.map(z=>z.length).join(' ')||'0');html=box('AKTE I // EIN LOGISCHES BILD','Das unvollständige Negativ',`<p>Färbe die passenden Kästchen. Jede Zahl gibt eine <strong>zusammenhängende Gruppe gefüllter Kästchen</strong> in ihrer Zeile oder Spalte an. Zwischen Gruppen liegt mindestens ein leeres Feld. Mehrere Zahlen liest man in Reihenfolge.</p><div class="nonowrap"><div></div>${cc.map(v=>`<div class="nclue col">${v.replaceAll(' ','<br>')}</div>`).join('')}${Array.from({length:8},(_,r)=>`<div class="nclue row">${rc[r]}</div>${Array.from({length:8},(_,c)=>`<button class="cell ${s.nono[r*8+c]===1?'on':s.nono[r*8+c]===2?'cross':''}" data-nono="${r*8+c}" aria-label="Zeile ${r+1}, Spalte ${c+1}" aria-pressed="${s.nono[r*8+c]===1}">${s.nono[r*8+c]===1?'■':s.nono[r*8+c]===2?'×':''}</button>`).join('')}`).join('')}</div><p class="muted">Tippen: leer → gefüllt → als leer markiert. Die als leer markierten Felder werden nicht als schwarze Kästchen gewertet.</p><button id="nonoCheck" class="btn full">Bild rekonstruieren</button>${hint('Beginne mit den Zeilen und Spalten mit großen Gruppen. Eine Gruppe von 6 braucht in acht Feldern fast die ganze Länge.','Arbeite abwechselnd mit Zeilen und Spalten und markiere bekannte Leerfelder mit ×. Das Lösungsbild ist symmetrisch.')}`);break;}
case 7:html=codeGate('KÜHLSCHRANK – aber noch nicht jetzt','NACHMITTAG','aft',8,'Das Logikbild hat den nächsten Ort freigegeben: KÜHLSCHRANK. Die Suche ist jedoch bis zum Nachmittag unterbrochen. Erst wenn dir dein Gastgeber den Umschlag NACHMITTAG überreicht, darfst du weitermachen.');break;
case 8:html=codeGate('Der Umschlag im Kühlschrank','KÜHLSCHRANK','fridge',9,'Suche jetzt im Kühlschrank. Dort liegt die Karte, mit der sich das Kontrollfeld aktivieren lässt.');break;
case 9:{const trace=s.trace||[];const path=trace.length?`<svg viewBox="0 0 600 600" preserveAspectRatio="none"><polyline points="${trace.map(([x,y])=>`${(x+.5)*100},${(y+.5)*100}`).join(' ')}" fill="none" stroke="#ffcf7d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/></svg>`:'';html=box('AKTE II // REFLEXION','Das Lichtnetz',`<p>Ein Lichtstrahl kommt <strong>von links in Zeile 5</strong> und muss die drei Sensoren <b>A → B → C</b> in dieser Reihenfolge treffen, bevor er <strong>rechts in Zeile 2</strong> austritt.</p><p class="muted">Tippe die schrägen Spiegel, um / und \ zu tauschen. Der Strahl wird erst mit „Strahl testen“ sichtbar. Auf der Kühlschrankkarte steht die Reihenfolge der Sensoren ebenfalls.</p><div class="laserboard">${Array.from({length:36},(_,i)=>`<button class="lx ${s.mirror[i]?'mirror':''} ${stamps[i]?'relay':''}" data-mirror="${i}" ${s.mirror[i]?'':'disabled'} aria-label="Feld ${Math.floor(i/6)+1},${i%6+1} ${s.mirror[i]?'Spiegel drehbar':''}">${stamps[i]||s.mirror[i]||''}</button>`).join('')}${path}</div><button id="laserCheck" class="btn full">Strahl testen</button>${hint('Denke bei jedem Spiegel an Einfallswinkel = Ausfallswinkel. Ein senkrechter Strahl kann nach links oder rechts abgelenkt werden.','Sensor A sitzt bei (Zeile 4, Spalte 2), B bei (Zeile 6, Spalte 4), C bei (Zeile 2, Spalte 5). Der Strahl darf keinen Sensor überspringen.')}`);break;}
case 10:html=codeGate('Am Esstisch','TISCH','table',11,'Das Lichtnetz hat einen neuen Fundort freigegeben. Suche am Tisch nach der letzten Akte für den Nachmittag.');break;
case 11:html=box('AKTE II // AUSSAGEN','Vier Personen, vier Gegenstände',`<p>Auf der Tischkarte stehen die Aussagen der vier Beteiligten. Jede Person hatte <strong>genau einen</strong> Gegenstand. Und jeder Gegenstand kommt genau einmal vor.</p><p>Ordne zu, wer was hatte. Die digitale Tafel prüft erst die vollständige Zuordnung.</p><div class="people">${['LENA','NILS','MIRA','TOM'].map(name=>`<div class="person"><label for="p${name}">${name}</label><select id="p${name}" class="field" data-person="${name}"><option value="">— auswählen —</option>${['LUPE','KOMPASS','LAMPE','SCHLUESSEL'].map(item=>`<option value="${item}" ${s.logic[name]===item?'selected':''}>${item==='SCHLUESSEL'?'SCHLÜSSEL':item}</option>`).join('')}</select></div>`).join('')}</div><button id="logicCheck" class="btn full">Aussagen abgleichen</button>${hint('Der Schlüssel ist weder bei Lena noch bei Mira. Der Kompass ist weder bei Tom noch bei Nils.','Lena hatte weder Lupe noch Lampe. Damit bleibt für sie nur der Kompass.')}`);break;
case 12:html=codeGate('Die letzte Freigabe','ABENDESSEN','eve',13,'Deine Ermittlung ist vorerst abgeschlossen. Die letzte versiegelte Karte bekommst du erst beim gemeinsamen Abendessen. Bewahre unbedingt den Anhänger deines ersten Geschenks auf.');break;
case 13:html=box('ABEND // DIE RÜCKSEITE','Die zwei Zahlenreihen',`<p>Die letzten Informationen standen heute Morgen bereits auf dem Geschenkanhänger. Seine acht Zeichen A bis H sind die fehlenden Nachkommastellen einer GPS-Koordinate.</p><div class="notice">Der Abendumschlag erklärt, welche Kennungen zur <strong>Nordspur</strong> und welche zur <strong>Ostspur</strong> gehören. Lies die Ziffern genau in dieser Reihenfolge ab.</div><div class="coords"><div class="coord"><strong>N 51.</strong>${input('lat','0000','numeric')}</div><div class="coord"><strong>E 10.</strong>${input('lon','0000','numeric')}</div></div><button id="coordCheck" class="btn full">Koordinaten rekonstruieren</button>${hint('Die Buchstaben auf der Rückseite des Anhängers sind wichtiger als ihre gedruckte Position.','Nord verwendet A, C, E, G. Ost verwendet B, D, F, H.')}`);break;
case 14:html=box('GPS-VERIFIZIERUNG // FAST AM ZIEL','Wo liegt dieser Punkt?',`<p>Die Koordinaten sind korrekt. Die Website verrät dir den Ortsnamen nicht. Finde ihn selbst heraus.</p><div class="bigcoords">51.7265° N<br>10.6109° E</div><div class="mapactions"><a class="btn alt" href="https://www.openstreetmap.org/?mlat=51.7265&amp;mlon=10.6109#map=13/51.7265/10.6109" target="_blank" rel="noopener noreferrer">⌖ In OpenStreetMap</a><a class="btn alt" href="https://www.google.com/maps?q=51.7265%2C10.6109" target="_blank" rel="noopener noreferrer">⌖ In Google Maps</a></div><p>Welcher <strong>Ort</strong> gehört zu diesem Punkt? Nutze die Karte, zoome etwas heraus und gib den Ortsnamen ein.</p>${input('place','ORTSNAME')}<button id="placeCheck" class="btn full">Letzte Antwort einreichen</button>${hint('Karten zeigen bei starker Vergrößerung oft nur Straßen. Zoome etwas heraus.','Gesucht ist die Stadt/Gemeinde in der Harzregion, nicht ein Straßenname.')}`);break;
case 15:html=box('PROJEKT 51 // ALLE AKTEN GESCHLOSSEN','Du hast das Ziel gefunden.',`<div class="reveal final"><div class="tag">DIE REISE WAR DAS EIGENTLICHE GESCHENK</div><div class="big" id="town">DEIN ZIEL</div><p>Das Geschenk im Sofa war echt. Aber es war nur der Anfang.</p><p><strong>Wir drei fahren zusammen weg.</strong></p><p id="dates" class="bigcoords">Reisedaten werden entschlüsselt</p><p>Und jetzt kannst du dir auch endlich ansehen, wo wir wohnen werden.</p><a id="airbnb" class="btn full" href="#" target="_blank" rel="noopener noreferrer">⌂ Unser Airbnb ansehen</a></div><p class="muted" id="decrypt">Entschlüssele Unterkunftsdaten …</p>`);break;
}
$('app').innerHTML=html;bind();}
function bind(){const p=s.phase;
document.querySelectorAll('[data-symbol]').forEach(e=>e.onclick=()=>{if(!s.order.includes(e.dataset.symbol)){s.order.push(e.dataset.symbol);save();render()}});click('undoOrder',()=>{s.order.pop();save();render()});click('checkOrder',()=>{if(s.order.join('')===solutionOrder)go(1);else err('Die sechs Aussagen lassen diese Anordnung nicht zu. Vergleiche alle Nachbarschaften und Abstände auf dem Frühstückszettel.')});
if([1,3,5,7,8,10,12].includes(p)){const targets={1:['mid',2],3:['shelf',4],5:['window',6],7:['aft',8],8:['fridge',9],10:['table',11],12:['eve',13]};click('gateBtn',()=>{let [which,next]=targets[p];gate('gate',next,which)});$('gate')?.addEventListener('keydown',e=>{if(e.key==='Enter')$('gateBtn')?.click()})}
document.querySelectorAll('[data-piece]').forEach(el=>el.onclick=()=>{let i=Number(el.dataset.piece);if(s.swap==null){s.swap=i;save();render()}else{[s.pieces[s.swap],s.pieces[i]]=[s.pieces[i],s.pieces[s.swap]];s.swap=null;save();render()}});click('picCheck',()=>{if(s.pieces.every((x,i)=>x===i))go(3);else err('Die Linien des Grundrisses sind noch unterbrochen. Schau auch auf die Buchstaben.')});
click('stencilCheck',()=>{if(norm($('stencil').value)==='FENSTER')go(5);else err('Nicht alle sieben Ausschnitte stimmen. Kontrolliere die Ausrichtung des Anhängers.')});
document.querySelectorAll('[data-nono]').forEach(el=>el.onclick=()=>{const i=Number(el.dataset.nono);s.nono[i]=(s.nono[i]+1)%3;save();render()});click('nonoCheck',()=>{if(s.nono.every((v,i)=>(v===1)===(nono[Math.floor(i/8)][i%8]==='1')))go(7);else err('Einige Kästchen stimmen noch nicht mit allen Zeilen- und Spaltenhinweisen überein.')});
document.querySelectorAll('[data-mirror]').forEach(el=>el.onclick=()=>{let i=Number(el.dataset.mirror);if(s.mirror[i]){s.mirror[i]=s.mirror[i]==='/'?'\\':'/';s.trace=[];save();render()}});click('laserCheck',()=>{const r=laser();s.trace=r.trace;save();if(r.ok)go(10);else{render();err('Der Strahl trifft die Sensoren noch nicht in der richtigen Reihenfolge oder verlässt das Feld an der falschen Seite.')}});
document.querySelectorAll('[data-person]').forEach(el=>el.onchange=()=>{s.logic[el.dataset.person]=el.value;save()});click('logicCheck',()=>{let ans=['KOMPASS','SCHLUESSEL','LUPE','LAMPE'];if(['LENA','NILS','MIRA','TOM'].every((v,i)=>s.logic[v]===ans[i]))go(12);else err('Mindestens eine Zuordnung widerspricht den Aussagen. Jeder Gegenstand darf nur einmal vorkommen.')});
click('coordCheck',()=>{if(($('lat').value||'').replace(/\D/g,'')==='7265'&&($('lon').value||'').replace(/\D/g,'')==='6109')go(14);else err('Die Koordinate ist noch nicht richtig zusammengesetzt. Kontrolliere die Kennungen A–H.')});
click('placeCheck',async()=>{if(await valid($('place').value,PLACE_HASH)){s.placeAnswer=norm($('place').value);go(15);}else err('Das ist noch nicht der richtige Ortsname. Zoome auf der Karte heraus und lies die Ortsbeschriftung.')});
if(p===15)showFinal();}
function laser(){const trace=[[-.5,4]],seen=new Set(),relays=[];let row=4,col=0,dx=1,dy=0,steps=0;while(row>=0&&row<6&&col>=0&&col<6&&steps++<100){const id=row*6+col,sign=s.mirror[id];trace.push([col,row]);let state=`${id}:${dx},${dy}`;if(seen.has(state))return {ok:false,trace};seen.add(state);if(stamps[id])relays.push(stamps[id]);if(sign==='/'){[dx,dy]=[-dy,-dx]}else if(sign==='\\'){[dx,dy]=[dy,dx]}col+=dx;row+=dy;}trace.push([col,row]);return{ok:row===1&&col===6&&relays.join('')==='ABC',trace};}
function fromB64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function showFinal(){try{const raw=fromB64(BLOB),salt=raw.slice(0,12),ct=raw.slice(12);const kdata=await crypto.subtle.digest('SHA-256',enc.encode(`P51|${s.eveKey}|${s.placeAnswer}`));const key=await crypto.subtle.importKey('raw',kdata,{name:'AES-GCM'},false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:salt},key,ct);let data=JSON.parse(new TextDecoder().decode(pt));$('town').textContent=data.town.toUpperCase();$('dates').textContent=data.dates;$('airbnb').href=data.url;$('decrypt').textContent='Hinweis: Airbnb wird aus Sicherheits- und Einbettungsgründen in einem neuen Tab geöffnet.';}catch(e){$('town').textContent=s.placeAnswer||'ZIELORT';$('decrypt').textContent='Die Unterkunft konnte auf diesem Browser nicht entschlüsselt werden. Öffne die Seite über HTTPS oder bitte die Spielleitung um den Link.';$('airbnb').style.display='none';}}
click('reset',()=>{if(confirm('Wirklich den gesamten Spielstand löschen?')){s=JSON.parse(JSON.stringify(defaults));save();render()}});render();
})();
</script></body></html>
